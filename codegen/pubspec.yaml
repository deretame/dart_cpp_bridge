name: dcb_codegen
description: >-
  Codegen bootstrap & runner for dart_cpp_bridge. Downloads a locked Python
  toolchain (python-build-standalone + libclang-ng + ruamel.yaml), verifies
  SHA-256, and invokes the Python codegen scripts.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  archive: ^4.0.0
  crypto: ^3.0.0
  http: ^1.2.0
  path: ^1.9.0
