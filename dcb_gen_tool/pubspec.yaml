name: dcb_gen_tool
description: >-
  Code generation CLI for dart_cpp_bridge. Downloads a pinned Python toolchain
  (python-build-standalone + libclang-ng), parses C++ headers via libclang, and
  generates Dart/C++ bridge code.
version: 2.1.0
repository: https://github.com/deretame/dart_cpp_bridge

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  archive: ^4.0.0
  crypto: ^3.0.0
  http: ^1.2.0
  path: ^1.9.0
  yaml: ^3.1.0

executables:
  dcb_gen_tool:
