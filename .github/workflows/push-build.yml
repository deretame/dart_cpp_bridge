name: dart_cpp_bridge CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════
  # Linux
  # ══════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 C++ 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取 Dart API DL 头文件
        run: cmake -P dart/fetch_dart_api.cmake

      - name: 构建 base_demo + smoke 测试
        run: |
          cmake -S examples/base_demo -B examples/base_demo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/base_demo/build --config Release --parallel
          ./examples/base_demo/build/dcb_smoke

      - name: Dart 包测试
        run: |
          cd dart
          dart pub get
          dart test

      - name: base_demo Dart 测试
        run: |
          cd examples/base_demo
          dart pub get
          dart test

      - name: codegen 生成 + 构建 + 测试
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen.dart generate ../examples/codegen_demo/dart_cpp_bridge.yaml
          cd ../examples/codegen_demo
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          dart pub get
          dart test

  # ══════════════════════════════════════════
  # Windows
  # ══════════════════════════════════════════
  build-windows:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: 设置 MSVC 环境
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
          Write-Host "VS install: $vsPath"
          $envLines = cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvarsall.bat`" x64 >nul 2>&1 && set"
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
            }
          }

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取 Dart API DL 头文件
        run: cmake -P dart/fetch_dart_api.cmake

      - name: 构建 base_demo + smoke 测试
        run: |
          cmake -S examples/base_demo -B examples/base_demo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/base_demo/build --config Release --parallel
          .\examples\base_demo\build\Release\dcb_smoke.exe

      - name: Dart 包测试
        run: |
          cd dart
          dart pub get
          dart test

      - name: base_demo Dart 测试
        run: |
          cd examples/base_demo
          dart pub get
          dart test

      - name: codegen 生成 + 构建 + 测试
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen.dart generate ../examples/codegen_demo/dart_cpp_bridge.yaml
          cd ../examples/codegen_demo
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          dart pub get
          dart test

  # ══════════════════════════════════════════
  # macOS
  # ══════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 安装 C++ 构建依赖
        run: brew install cmake || true

      - name: 设置 Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 获取 Dart API DL 头文件
        run: cmake -P dart/fetch_dart_api.cmake

      - name: 构建 base_demo + smoke 测试
        run: |
          cmake -S examples/base_demo -B examples/base_demo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/base_demo/build --config Release --parallel
          ./examples/base_demo/build/dcb_smoke

      - name: Dart 包测试
        run: |
          cd dart
          dart pub get
          dart test

      - name: base_demo Dart 测试
        run: |
          cd examples/base_demo
          dart pub get
          dart test

      - name: codegen 生成 + 构建 + 测试
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen.dart generate ../examples/codegen_demo/dart_cpp_bridge.yaml
          cd ../examples/codegen_demo
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
          dart pub get
          dart test

  # ══════════════════════════════════════════
  # Android (emulator)
  # ══════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v5

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 安装 NDK 29 + CMake
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"

      - name: 获取 Dart API DL 头文件
        run: cmake -P dart/fetch_dart_api.cmake

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 运行集成测试（x86_64 模拟器）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            cd ${{ github.workspace }}/examples/android_demo && flutter pub get && flutter test integration_test
