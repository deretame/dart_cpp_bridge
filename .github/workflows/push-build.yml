name: dart_cpp_bridge CI

on:
  push:
    branches:
      - main
      - feat/stdexec-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ══════════════════════════════════════════
  # Linux
  # ══════════════════════════════════════════
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git \
            clang libgtk-3-dev ninja-build pkg-config xvfb

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: 构建 base_demo + smoke 测试
        run: |
          cmake -S examples/base_demo -B examples/base_demo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/base_demo/build --config Release --parallel
          ./examples/base_demo/build/dcb_smoke

      - name: Dart 包测试
        run: |
          cd dart
          dart pub get
          dart test

      - name: codegen 生成 + 集成测试 (Linux desktop)
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen_tool.dart generate --skip-version-check ../examples/codegen_demo/dart_cpp_bridge.yaml
          cd ../examples/codegen_demo
          flutter pub get
          xvfb-run -a flutter test integration_test/ -d linux

  # ══════════════════════════════════════════
  # Windows
  # ══════════════════════════════════════════
  build-windows:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: 构建 base_demo + smoke 测试
        run: |
          cmake -S examples/base_demo -B examples/base_demo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/base_demo/build --config Release --parallel
          .\examples\base_demo\build\Release\dcb_smoke.exe

      - name: Dart 包测试
        run: |
          cd dart
          dart pub get
          dart test

      - name: codegen 生成 + 集成测试 (Windows desktop)
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen_tool.dart generate --skip-version-check ../examples/codegen_demo/dart_cpp_bridge.yaml
          cd ../examples/codegen_demo
          flutter pub get
          flutter test integration_test/ -d windows

  # ══════════════════════════════════════════
  # macOS
  # ══════════════════════════════════════════
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: 安装 C++ 构建依赖
        run: brew install cmake || true

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: 构建 base_demo + smoke 测试
        run: |
          cmake -S examples/base_demo -B examples/base_demo/build -DCMAKE_BUILD_TYPE=Release
          cmake --build examples/base_demo/build --config Release --parallel
          ./examples/base_demo/build/dcb_smoke

      - name: Dart 包测试
        run: |
          cd dart
          dart pub get
          dart test

      - name: codegen 生成 + 集成测试 (macOS desktop)
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen_tool.dart generate --skip-version-check ../examples/codegen_demo/dart_cpp_bridge.yaml
          cd ../examples/codegen_demo
          flutter pub get
          flutter test integration_test/ -d macos

  # ══════════════════════════════════════════
  # iOS (simulator)
  # ══════════════════════════════════════════
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: codegen 生成
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen_tool.dart generate --skip-version-check ../examples/codegen_demo/dart_cpp_bridge.yaml

      - name: 下载 iOS 模拟器运行时
        run: |
          # 确保模拟器运行时与 Xcode SDK 版本匹配
          xcodebuild -downloadPlatform iOS || true

      - name: 启动 iOS 模拟器
        run: |
          xcrun simctl list devices available
          # 提取第一个可用 iPhone 的 UUID
          DEVICE_UDID=$(xcrun simctl list devices available | grep -E 'iPhone.*\(' | grep -oE '[A-F0-9-]{36}' | head -1)
          echo "Using device UDID: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          # 等待模拟器完全启动
          sleep 10
          xcrun simctl list devices booted
          echo "DEVICE_UDID=$DEVICE_UDID" >> $GITHUB_ENV

      - name: 运行集成测试
        working-directory: examples/codegen_demo
        run: |
          flutter pub get
          flutter test integration_test -d "$DEVICE_UDID"

  # ══════════════════════════════════════════
  # Android (emulator)
  # ══════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v7

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable

      - name: 安装 NDK 29 + CMake
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: codegen 生成
        run: |
          cd dcb_gen_tool
          dart pub get
          dart run bin/dcb_gen_tool.dart generate --skip-version-check ../examples/codegen_demo/dart_cpp_bridge.yaml

      - name: 运行集成测试（x86_64 模拟器）
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: |
            cd ${{ github.workspace }}/examples/codegen_demo && flutter pub get && flutter test integration_test
