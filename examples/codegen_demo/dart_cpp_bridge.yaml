# Codegen config for examples/codegen_demo
cpp_root: native/

scan:
  - native/api/

include_paths:
  - native
  - native/api
  - ../../dart/native/include
  - ../../dcb_gen_tool/stubs

dart_output: lib/src/native_gen/
cpp_wire_output: native/generated/

# Optional: path to clang-format executable or its containing directory.
# Falls back to `clang-format` on PATH when not configured.
clang_format: C:\Program Files\LLVM\bin

std: c++20
defines:
  - BRIDGE_CODEGEN
  - DART_CPP_BRIDGE_CODEGEN

# Optional: custom Dart code injected verbatim into a generated data class
# body. When present for a type it replaces the auto-generated toString().
# Point keeps the default toString; Rect shows a custom one.
dart_code:
  Rect: |
    @override
    String toString() => 'Rect[$topLeft -> $bottomRight]';
