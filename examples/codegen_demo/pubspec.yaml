name: codegen_demo
description: >-
  Fixture for dart_cpp_bridge codegen (SYNC/ASYNC/NORMAL) with a Flutter app
  shell and Android integration tests.
version: 0.1.0-dev.2
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.2.1
  dart_cpp_bridge:
    path: ../../dart
  ffi: ^2.1.3
  hooks: ^2.1.0

# flutter_test pins meta 1.18.0 while hooks requires ^1.19.0.
dependency_overrides:
  meta: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
