# Codegen config for examples/multi_runtime_demo
cpp_root: native/

scan:
  - native/api/

include_paths:
  - native
  - native/api
  - ../../dart/native/include
  - ../../dcb_gen_tool/stubs

dart_output: lib/src/native_gen/
cpp_wire_output: native/generated/

# Optional: list of clang-format candidate paths (tried top-to-bottom).
# Each entry can be an executable path or its containing directory.
# Falls back to `clang-format` on PATH when none of the candidates exist.
clang_format:
  - C:\Program Files\LLVM\bin

std: c++20
defines:
  - BRIDGE_CODEGEN
  - DART_CPP_BRIDGE_CODEGEN
