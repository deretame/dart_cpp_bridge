name: dcb_multi_runtime_demo
description: >
  Demo: non-blocking message passing between multiple C++ runtimes
  (main bridge scheduler + independent workers) via coroutine channels.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_cpp_bridge:
    path: ../../dart
  code_assets: ^1.2.1
  ffi: ^2.1.3
  hooks: ^2.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
